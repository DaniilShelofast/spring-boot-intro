databaseChangeLog:
    - changeSet:
        id: add-not-null-constraint-to-books
        author: Danyil
        changes:
          - addNotNullConstraint:
                tableName: books
                columnName: description
                columnDataType: varchar(255)

          - addNotNullConstraint:
                tableName: books
                columnName: cover_image
                columnDataType: varchar(255)

          - addDefaultValue:
                tableName: books
                columnName: price
                columnDataType: decimal(3,1)
                defaultValueNumeric: '0.0'
