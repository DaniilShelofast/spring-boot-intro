databaseChangeLog:
  - changeSet:
      id: create-book-category-table
      author: user
      changes:
        - createTable:
            tableName: book_category
            columns:
              - column:
                  name: book_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: bigint
                  constraints:
                    nullable: false

            constraints:
              primaryKey: true
              primaryKeyName: pk_book_category
              primaryKeyTablespace: book_category
              columnNames: book_id, category_id
